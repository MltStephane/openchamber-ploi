name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - name: Built files match the sources
        run: |
          bun run build
          git diff --exit-code -- panel/main.js service/main.js
      - run: bunx openchamber-guest-check
